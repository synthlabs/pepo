[package]
edition = "2021"
name = "pepo-internal"
version = "0.1.0"

[features]
default = []
runtime = ["dep:specta", "dep:tauri", "dep:tauri-specta"]

[dependencies.serde]
features = ["derive"]
version = "1"

[dependencies.specta]
features = ["derive", "function"]
optional = true
version = "=2.0.0-rc.28"

[dependencies.tauri]
features = []
optional = true
version = "2"

[dependencies.tauri-specta]
features = ["derive", "typescript"]
optional = true
version = "=2.0.0-rc.29"
