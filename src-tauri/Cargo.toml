[[bin]]
name = "pepo"
path = "src/main.rs"

[build-dependencies]
[build-dependencies.inbound-build]
path = "../utils/rust/inbound-build"
[build-dependencies.pepo-internal]
default-features = false
path = "../internal/rust"
[build-dependencies.tauri-build]
features = []
version = "2"
[build-dependencies.translate-build]
path = "../utils/rust/translate-build"

[dependencies]
color-eyre = "0.6.5"
eyre = "0.6.14"
futures = "0.3.34"
httpdate = "1"
lazy_static = "1.5.1"
log = "0.4.35"
serde_json = "1"
specta-typescript = "0.0.15"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
tracing-subscriber = "0.3.23"
[dependencies.inbound]
path = "../utils/rust/inbound"
[dependencies.pepo-internal]
features = ["runtime"]
path = "../internal/rust"
[dependencies.reqwest]
default-features = false
features = ["native-tls", "charset", "http2", "system-proxy", "json"]
version = "0.13.5"
[dependencies.serde]
features = ["derive"]
version = "1"
[dependencies.specta]
features = ["derive", "function"]
version = "=2.0.0-rc.28"
[dependencies.synth-translate]
features = ["tauri-plugin"]
path = "../utils/rust/translate"
[dependencies.tauri]
features = []
version = "2"
[dependencies.tauri-specta]
features = ["derive", "typescript"]
version = "=2.0.0-rc.29"
[dependencies.tauri-svelte-synced-store]
git = "https://github.com/synthlabs/tauri-svelte-synced-store.git"
[dependencies.time]
features = ["formatting"]
version = "0.3.55"
[dependencies.tokio]
features = ["macros", "rt-multi-thread"]
version = "1.54"
[dependencies.tokio-tungstenite]
features = ["native-tls", "url"]
version = "~0.30"
[dependencies.tracing]
features = ["log"]
version = "0.1.44"
[dependencies.twitch_api]
features = ["eventsub", "helix", "reqwest"]
version = "~0.8.0"
[dependencies.twitch_oauth2]
features = ["client"]
version = "0.17.1"

[dev-dependencies]
httpmock = "0.9.0"
[dev-dependencies.tokio]
features = ["test-util"]
version = "1.54"

[[example]]
name = "gen_bindings"
required-features = ["gen_bindings"]

[features]
gen_bindings = []

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]
name = "pepo_lib"

[package]
authors = ["you"]
autobins = false
default-run = "pepo"
description = "A Tauri App"
edition = "2021"
name = "pepo"
version = "0.2.33"

[profile]
[profile.dev]
[profile.dev.package]
[profile.dev.package.backtrace]
opt-level = 3

[target]
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))"]
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
[target."cfg(target_os = \"macos\")"]
[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
[target."cfg(target_os = \"windows\")"]
[target."cfg(target_os = \"windows\")".dependencies]
[target."cfg(target_os = \"windows\")".dependencies.windows]
features = ["Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging"]
version = "0.62"
[target."cfg(target_os = \"windows\")".dev-dependencies]
[target."cfg(target_os = \"windows\")".dev-dependencies.windows]
features = ["Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse"]
version = "0.62"
